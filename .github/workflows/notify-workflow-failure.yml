name: Notify Workflow Failure

# Posts to Telegram when one of the workflows below fails, times out or can't start. "Create Event from Issue"
# isn't listed because it alerts on its own (with the issue link), nor are PR preview builds, whose failures the
# PR's author sees on the PR.
# workflow_run only runs from the default branch, and never checks out the failed run's code here.
on:
  workflow_run:
    workflows:
      - "(Scheduled) Event Discovery"
      - "(Scheduled) Nightly Builds"
      - "(Manual) Production Builds"
      - "(Manual) Event Scrapper"
      - "Google Form Webhook Triggered Workflow"
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: ${{ contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # the default branch, which holds the script; never the failed run's head
          ref: ${{ github.event.repository.default_branch }}
      - name: List failed jobs
        id: jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          {
            echo "names<<EOF"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name' || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # commit messages and PR titles are user-controlled: passed through env only
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          FAILED_JOBS: ${{ steps.jobs.outputs.names }}
        run: bash scripts/notify-telegram-failure.sh
