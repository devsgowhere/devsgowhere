name: Build Template

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the commit that triggered the workflow)"
        required: false
        type: string
        default: ""

jobs:
  ##########################################
  # Build job
  # - Builds the project and archives the dist folder as an artifact
  ##########################################
  build:
    runs-on: ubuntu-24.04
    container: node:24-alpine # Use Node.js 24 container
    steps:
      - run: echo "The job was automatically triggered by a ${{github.event_name}} event."
      - run: echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      # Checkout the repository
      - name: Check out the repository code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      # Install node dependencies
      - name: Install dependencies
        run: npm ci
      # Build the project
      - name: Build
        run: npm run build
      # Upload dist as artifact - so that it can be used in the deploy jobs
      - name: Archive dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
