name: (Scheduled) Event Discovery

# Checks every org's Meetup group / Luma calendar (from the `meetup` and `website` fields of
# src/content/orgs/<org>/index.md) for upcoming events not yet in src/content/events, scrapes them,
# and opens (or refreshes) a single PR on a fixed branch. Each platform (Luma, Meetup.com, others) is discovered
# by its own job, so one failing or slow platform doesn't hold up the others; a publish job then combines their
# events into the PR. The PR is then merged automatically and production
# is redeployed, unless auto-merge is turned off for a manual run (or the merge fails), in which case it
# waits for review.

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Singapore"
  workflow_dispatch:
    inputs:
      org:
        description: "Only check this org ID (leave empty for all orgs)"
        required: false
        type: string
      days:
        description: "Only add events starting within this many days"
        required: false
        type: number
        default: 60
      auto_merge:
        description: "Merge the PR and deploy automatically (untick to leave it for review)"
        required: false
        type: boolean
        default: true

# Discovery and the build compare dates in Singapore time
env:
  TZ: Asia/Singapore

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: event-discovery
  cancel-in-progress: false

jobs:
  discover-events:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: luma
            name: Luma events
          - platform: meetup
            name: Meetup.com events
          # No discovery for other sites (e.g. Eventbrite) yet, so this finds nothing until one is added
          - platform: other
            name: Other events
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Meetup groups are read via the Meetup API when its secrets are set (JWT flow), otherwise scraped
      - name: Discover and scrape new events
        env:
          ORG: ${{ inputs.org }}
          DAYS: ${{ inputs.days || 60 }}
          PLATFORM: ${{ matrix.platform }}
          MEETUP_CLIENT_ID: ${{ secrets.MEETUP_CLIENT_ID }}
          MEETUP_SIGNING_KEY_ID: ${{ secrets.MEETUP_SIGNING_KEY_ID }}
          MEETUP_PRIVATE_KEY: ${{ secrets.MEETUP_PRIVATE_KEY }}
          MEETUP_MEMBER_ID: ${{ secrets.MEETUP_MEMBER_ID }}
        run: npm run discover-events -- --platform="$PLATFORM" --days="$DAYS" ${ORG:+--org="$ORG"}
      # Hand the new and rewritten event files and this platform's summary to the publish job, at their paths in the
      # repo (discovery rewrites an existing event's folder when it finds it again under another URL)
      - name: Collect new events
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p discovered/scraper-output
          git ls-files --others --modified --exclude-standard -z src/content | xargs -0 -r cp --parents -t discovered
          cp scraper-output/discovery-summary.md "discovered/scraper-output/discovery-summary-${PLATFORM}.md"
      - name: Upload new events
        uses: actions/upload-artifact@v7
        with:
          name: discovered-${{ matrix.platform }}
          path: discovered/
          retention-days: 1

  publish:
    needs: discover-events
    # Publish what the other platforms found even if one platform's job failed (the failure alert covers that one)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outcome == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download new events
        uses: actions/download-artifact@v8
        with:
          pattern: discovered-*
          merge-multiple: true
          path: .
      - name: Write the PR summary
        run: |
          {
            echo "Events discovered automatically from each org's Meetup group / Luma calendar by the event discovery workflow."
            echo "Scheduled runs merge this PR automatically once the site builds; if it's still open, auto-merge was off or failed."
            echo 'Fix any wrong details (venue, description, hero image) on `main`.'
            for f in scraper-output/discovery-summary-*.md; do
              [ -e "$f" ] || continue
              echo
              cat "$f"
            done
          } > scraper-output/discovery-summary.md
      # Orgs added by hand don't regenerate the "Submit an event" issue form's dropdown, so sync it here
      # (this PR is merged automatically)
      - name: Sync the issue form's organisation list
        run: |
          npm run update-issue-template
          if ! git diff --quiet -- .github/ISSUE_TEMPLATE/; then
            printf '\n### Issue form\n- Synced the "Submit an event" organisation dropdown with `src/content/orgs`\n' >> scraper-output/discovery-summary.md
          fi
      # Validate the generated content against the schemas before opening a PR
      - name: Build site
        run: npm run build
      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          # Fixed branch: each run regenerates it from main, so an open PR is updated instead of duplicated
          branch: event-discovery/auto
          base: main
          add-paths: |
            src/content/
            .github/ISSUE_TEMPLATE/
          commit-message: "Add auto-discovered events"
          title: "Add auto-discovered events"
          body-path: scraper-output/discovery-summary.md
          labels: event
          delete-branch: true
      - name: Print Pull Request info
        if: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: |
          echo "Pull Request ${{ steps.create-pull-request.outputs.pull-request-operation }}: ${{ steps.create-pull-request.outputs.pull-request-url }}"
      # Scheduled runs have no inputs (and null == false in expressions), so check the event explicitly.
      # If the merge is refused (e.g. by the branch ruleset), the PR stays open for review.
      - name: Merge Pull Request
        id: merge
        if: ${{ (github.event_name == 'schedule' || inputs.auto_merge) && (steps.create-pull-request.outputs.pull-request-operation == 'created' || steps.create-pull-request.outputs.pull-request-operation == 'updated') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge -f commit_title="Merge auto-discovered events (#${PR_NUMBER})"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/event-discovery/auto" || true
      # Notify only when the PR was opened or its events changed (a run that finds nothing new reports "none")
      - name: Notify Telegram
        if: ${{ steps.create-pull-request.outputs.pull-request-operation == 'created' || steps.create-pull-request.outputs.pull-request-operation == 'updated' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
          PR_STATE: ${{ (steps.merge.outcome == 'success' && 'merged') || (steps.merge.outcome == 'failure' && 'merge-failed') || steps.create-pull-request.outputs.pull-request-operation }}
        run: bash scripts/notify-telegram.sh scraper-output/discovery-summary.md "$PR_URL" "$PR_STATE"

  # Merges made with GITHUB_TOKEN don't trigger the push-to-main production workflow, so deploy from here
  build:
    needs: publish
    if: ${{ needs.publish.outputs.merged == 'true' }}
    uses: ./.github/workflows/build-template.yml
    with:
      ref: main

  deploy-production:
    needs: build
    uses: ./.github/workflows/deploy-template.yml
    with:
      env_name: nightly # the "production" environment needs reviewer approval; this one deploys to the same Cloudflare production without it
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
