name: (Scheduled) Event Discovery

# Checks every org's Meetup group / Luma calendar (from the `meetup` and `website` fields of
# src/content/orgs/<org>/index.md) for upcoming events not yet in src/content/events, scrapes them,
# and opens (or refreshes) a single PR on a fixed branch. The PR is then merged automatically and production
# is redeployed, unless auto-merge is turned off for a manual run (or the merge fails), in which case it
# waits for review.

on:
  schedule:
    - cron: "0 22 * * *" # Daily at 06:00 SGT (22:00 UTC)
  workflow_dispatch:
    inputs:
      org:
        description: "Only check this org ID (leave empty for all orgs)"
        required: false
        type: string
      days:
        description: "Only add events starting within this many days"
        required: false
        type: number
        default: 60
      auto_merge:
        description: "Merge the PR and deploy automatically (untick to leave it for review)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: event-discovery
  cancel-in-progress: false

jobs:
  discover-events:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outcome == 'success' }}
    steps:
      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Singapore"
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Discover and scrape new events
        env:
          ORG: ${{ inputs.org }}
          DAYS: ${{ inputs.days || 60 }}
        run: npm run discover-events -- --days="$DAYS" ${ORG:+--org="$ORG"}
      # Validate the generated content against the schemas before opening a PR
      - name: Build site
        run: npm run build
      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          # Fixed branch: each run regenerates it from main, so an open PR is updated instead of duplicated
          branch: event-discovery/auto
          base: main
          add-paths: |
            src/content/
          commit-message: "Add auto-discovered events"
          title: "Add auto-discovered events"
          body-path: scraper-output/discovery-summary.md
          labels: event
          delete-branch: true
      - name: Print Pull Request info
        if: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: |
          echo "Pull Request ${{ steps.create-pull-request.outputs.pull-request-operation }}: ${{ steps.create-pull-request.outputs.pull-request-url }}"
      # Scheduled runs have no inputs (and null == false in expressions), so check the event explicitly.
      # If the merge is refused (e.g. by the branch ruleset), the PR stays open for review.
      - name: Merge Pull Request
        id: merge
        if: ${{ (github.event_name == 'schedule' || inputs.auto_merge) && (steps.create-pull-request.outputs.pull-request-operation == 'created' || steps.create-pull-request.outputs.pull-request-operation == 'updated') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge -f commit_title="Merge auto-discovered events (#${PR_NUMBER})"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/event-discovery/auto" || true
      # Notify only when the PR was opened or its events changed (a run that finds nothing new reports "none")
      - name: Notify Telegram
        if: ${{ steps.create-pull-request.outputs.pull-request-operation == 'created' || steps.create-pull-request.outputs.pull-request-operation == 'updated' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
          PR_STATE: ${{ (steps.merge.outcome == 'success' && 'merged') || (steps.merge.outcome == 'failure' && 'merge-failed') || steps.create-pull-request.outputs.pull-request-operation }}
        run: bash scripts/notify-telegram.sh scraper-output/discovery-summary.md "$PR_URL" "$PR_STATE"

  # Merges made with GITHUB_TOKEN don't trigger the push-to-main production workflow, so deploy from here
  build:
    needs: discover-events
    if: ${{ needs.discover-events.outputs.merged == 'true' }}
    uses: ./.github/workflows/build-template.yml
    with:
      ref: main

  deploy-production:
    needs: build
    uses: ./.github/workflows/deploy-template.yml
    with:
      env_name: production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
