name: Create Event from Issue

# Turns a "Submit an event" issue (.github/ISSUE_TEMPLATE/new-event.yml) into a pull request: validates the
# submission, scrapes the event with the create-event CLI, builds the site, opens a PR that closes the issue,
# replies on the issue and posts to Telegram. Editing the issue re-runs it and updates the same PR.
#
# Issue text is untrusted: it only reaches the shell through environment variables, never through ${{ }} in a
# script, and the URL and org ID are validated (cli/check-event-request.ts) before the CLI sees them.
on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Number of the event submission issue to process"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: create-event-from-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  create-event:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'new-event'))
    runs-on: ubuntu-latest
    steps:
      - name: Read the submission
        id: issue
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
            })
            // Issue forms render each field as "### <label>\n\n<value>", with "_No response_" when left empty
            const sections = Object.fromEntries(
              (issue.body ?? "").split(/^### /m).slice(1).map((section) => {
                const [label, ...value] = section.split("\n")
                return [label.trim(), value.join("\n").trim()]
              }),
            )
            const field = (label) => (sections[label] === "_No response_" ? "" : (sections[label] ?? ""))
            core.setOutput("number", issue.number)
            core.setOutput("title", issue.title)
            core.setOutput("url", issue.html_url)
            core.setOutput("author", issue.user.login)
            core.setOutput("event_url", field("Event URL"))
            core.setOutput("org_choice", field("Organisation"))
            core.setOutput("new_org_id", field("New organisation ID").replace(/^`|`$/g, ""))
            core.setOutput("notes", field("Notes for the team"))

      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Validate the submission
        id: validate
        env:
          EVENT_URL: ${{ steps.issue.outputs.event_url }}
          ORG_CHOICE: ${{ steps.issue.outputs.org_choice }}
          NEW_ORG_ID: ${{ steps.issue.outputs.new_org_id }}
        run: |
          result=$(npx tsx cli/check-event-request.ts --url="$EVENT_URL" --org-choice="$ORG_CHOICE" --new-org-id="$NEW_ORG_ID")
          echo "$result"
          {
            echo "ok=$(jq -r .ok <<< "$result")"
            echo "event_url=$(jq -r '.url // ""' <<< "$result")"
            echo "org_id=$(jq -r '.orgId // ""' <<< "$result")"
            echo "creates_org=$(jq -r '.createsOrg // false' <<< "$result")"
            echo "errors<<EOF"
            jq -r '(.errors // [])[] | "- " + .' <<< "$result"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Reply with validation errors
        if: ${{ steps.validate.outputs.ok != 'true' }}
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ERRORS: ${{ steps.validate.outputs.errors }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: [
                "Thanks for the submission! I couldn't add this event yet:",
                "",
                process.env.ERRORS,
                "",
                "Edit the issue to fix it and I'll try again.",
              ].join("\n"),
            })

      - name: Scrape the event
        if: ${{ steps.validate.outputs.ok == 'true' }}
        env:
          EVENT_URL: ${{ steps.validate.outputs.event_url }}
          ORG_ID: ${{ steps.validate.outputs.org_id }}
          MEETUP_CLIENT_ID: ${{ secrets.MEETUP_CLIENT_ID }}
          MEETUP_SIGNING_KEY_ID: ${{ secrets.MEETUP_SIGNING_KEY_ID }}
          MEETUP_PRIVATE_KEY: ${{ secrets.MEETUP_PRIVATE_KEY }}
          MEETUP_MEMBER_ID: ${{ secrets.MEETUP_MEMBER_ID }}
        run: npm run create-event -- --eventURL="$EVENT_URL" --orgID="$ORG_ID"

      - name: Read the scraped event
        if: ${{ steps.validate.outputs.ok == 'true' }}
        id: event
        run: |
          file=$(git status --porcelain --untracked-files=all src/content/events | awk '{print $2}' | grep '/index.md$' | head -n 1)
          if [ -z "$file" ]; then
            echo "::error::create-event didn't write an event file"
            exit 1
          fi
          read_field() { sed -n "s/^$1: \"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p" "$file" | head -n 1; }
          {
            echo "file=$file"
            echo "title=$(read_field title)"
            echo "date=$(read_field startDate) $(read_field startTime)"
            echo "venue=$(read_field venue)"
          } >> "$GITHUB_OUTPUT"

      # Validate the generated content against the schemas before opening a PR
      - name: Build site
        if: ${{ steps.validate.outputs.ok == 'true' }}
        run: npm run build

      - name: Create Pull Request
        if: ${{ steps.validate.outputs.ok == 'true' }}
        id: create-pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          # One branch per issue: editing the issue updates the same PR
          branch: event-issue/${{ steps.issue.outputs.number }}
          base: main
          # a new org is also added to this issue form's dropdown (OrgWriter regenerates it)
          add-paths: |
            src/content/
            .github/ISSUE_TEMPLATE/
          commit-message: "Add event: ${{ steps.event.outputs.title }} (#${{ steps.issue.outputs.number }})"
          title: "Add event: ${{ steps.event.outputs.title }}"
          body: |
            Closes #${{ steps.issue.outputs.number }}, submitted by @${{ steps.issue.outputs.author }}.

            | | |
            |---|---|
            | Event | ${{ steps.validate.outputs.event_url }} |
            | Organisation | `${{ steps.validate.outputs.org_id }}`${{ steps.validate.outputs.creates_org == 'true' && ' (new, created from its Meetup group)' || '' }} |
            | When | ${{ steps.event.outputs.date }} |
            | Venue | ${{ steps.event.outputs.venue }} |

            Generated by the create-event CLI from the event page. Before merging, check the date, time, venue, description and hero image${{ steps.validate.outputs.creates_org == 'true' && ', and the new organisation page' || '' }}.

            ### Notes from the submitter

            ${{ steps.issue.outputs.notes || '_None_' }}
          labels: event
          delete-branch: true

      - name: Reply with the pull request
        if: ${{ steps.create-pull-request.outputs.pull-request-operation == 'created' || steps.create-pull-request.outputs.pull-request-operation == 'updated' }}
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
          OPERATION: ${{ steps.create-pull-request.outputs.pull-request-operation }}
        with:
          script: |
            const action = process.env.OPERATION === "created" ? "Thanks! I've opened" : "I've updated"
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `${action} ${process.env.PR_URL} with this event. The team will review it, and this issue closes when it's merged.`,
            })

      # PRs opened with GITHUB_TOKEN don't trigger notify-new-pr.yml, so notify from here
      - name: Notify Telegram
        if: ${{ steps.create-pull-request.outputs.pull-request-operation == 'created' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_TITLE: "Add event: ${{ steps.event.outputs.title }}"
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
          PR_AUTHOR: ${{ steps.issue.outputs.author }}
          PR_VIA: "issue #${{ steps.issue.outputs.number }}"
        run: bash scripts/notify-telegram-pr.sh

      - name: Reply on failure
        if: ${{ failure() }}
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number || github.event.issue.number || inputs.issue_number }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `Sorry, something went wrong while adding this event ([workflow run](${run})). The team has been notified and will take a look.`,
            })
      - name: Notify Telegram of the failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADING: "⚠️ Couldn't create a PR for an event submission"
          PR_TITLE: ${{ steps.issue.outputs.title || 'event submission' }}
          PR_URL: ${{ steps.issue.outputs.url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          PR_AUTHOR: ${{ steps.issue.outputs.author || github.actor }}
          PR_VIA: "workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bash scripts/notify-telegram-pr.sh
