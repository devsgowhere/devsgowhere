name: Submit an event (other websites)
description: Add a tech event in Singapore that isn't on Meetup, Luma or Eventbrite, by filling in its details.
title: "New event: "
labels: ["new-event-details"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for events registered through Google Forms, FormSG, a conference site or anywhere else. If your event is on **Meetup, Luma or Eventbrite**, use the "Submit an event" form instead: it copies the details for you.

        A bot turns your answers into a pull request, and the team will review it.
  - type: input
    id: title
    attributes:
      label: Event title
      placeholder: "Singapore Rust Meetup: November 2026"
    validations:
      required: true
  - type: dropdown
    id: org-id
    attributes:
      label: Organisation
      description: The organisation running the event. Not listed? Choose the last option and fill in "New organisation name".
      options:
        # BEGIN org options (generated by `npm run update-issue-template`, don't edit by hand)
        - ".NET Developers Community Singapore (net_developers_sg)"
        - "Agile Singapore (agile-singapore)"
        - "AI Events SG (ai_events_sg)"
        - "Angular Singapore (angular_singapore)"
        - "Ansible Singapore (ansible_singapore)"
        - "AWS User Group Singapore (aws_user_group_singapore)"
        - "Build for Good (build_for_good)"
        - "Data Engineering Singapore (data_engineering_sg)"
        - "DataScience SG (datascience_sg)"
        - "DevOps Singapore (devops_singapore)"
        - "DevsGoWhere (devsgowhere)"
        - "Division Zero (Div0) – Singapore Cybersecurity Community (division_zero_div0)"
        - "Flutter Singapore (flutter_sg)"
        - "FOSSASIA Singapore Open Tech Meetup (fossasia)"
        - "Geekcamp Singapore (geekcampsg)"
        - "GeeksHacking (geekshacking)"
        - "gen_c_singapore (gen_c_singapore)"
        - "GoSG (golang_sg)"
        - "Graph Database Singapore (graphdb-singapore)"
        - "HackerspaceSG (hackerspacesg)"
        - "Hackware (hackware)"
        - "iOS Conf SG (iosconf_sg)"
        - "iOS Dev Scout (ios-dev-scout)"
        - "Junior Developers Singapore (juniordevsg)"
        - "KopiJS (kopijs)"
        - "Le Wagon Singapore - Coding Bootcamp (le-wagon-singapore-coding-bootcamp)"
        - "LeSS Singapore (less_singapore)"
        - "Lorong AI - Singapore AI Community (lorong-ai)"
        - "Machine Learning Singapore (tensorflow_deep_learning_sg)"
        - "MariaDB Singapore Meetup Group (mariadb_singapore_meetup_group)"
        - "NUS Greyhats (nus_greyhats)"
        - "NUS Hackers (nus_hackers)"
        - "ProductTank Singapore (product_tank_singapore)"
        - "Public Sector Tech Careers (public_sector_tech_careers)"
        - "Python User Group Singapore (python_user_group_singapore)"
        - "R User Group Singapore (RUGS) (rugs)"
        - "RubySG (rubysg)"
        - "SingaDev (singadev)"
        - "Singapore Data & AI Engineering (sg_data_n_ai_engineering)"
        - "Singapore Microsoft Azure, M365 & Power Platform (microsoft_user_groups_singapore)"
        - "Singapore Robot Operating System(ROS) Meetup (singapore-ros-meetup)"
        - "Singapore Youth AI (sgyouthai)"
        - "SingaporeJS (singaporejs)"
        - "STACK by GovTech (stack_govtech)"
        - "TAQELAH Singapore (taqelah-sg)"
        - "Tech Leadership Circle (tech_leadership_circle)"
        - "Tech Talks by Thoughtworks (tech-talks-thoughtworks-singapore)"
        - "Techies (apac_techies)"
        - "UXSEA Society (uxsea)"
        - "Vue JS Singapore (vue-js-singapore)"
        - "Women Devs SG (women_devs_sg)"
        - "WordPress Singapore (wordpress_singapore)"
        - "My organisation isn't listed (new organisation)"
        # END org options
    validations:
      required: true
  - type: input
    id: new-org-name
    attributes:
      label: New organisation name
      description: Only if your organisation isn't listed above. We'll create a basic page for it that the team can fill in.
      placeholder: Singapore Rust Meetup
    validations:
      required: false
  - type: input
    id: start-date
    attributes:
      label: Start date
      description: YYYY-MM-DD
      placeholder: "2026-11-05"
    validations:
      required: true
  - type: input
    id: start-time
    attributes:
      label: Start time
      description: Singapore time, e.g. 18:30 or 6:30pm
      placeholder: "18:30"
    validations:
      required: true
  - type: input
    id: end-date
    attributes:
      label: End date
      description: Optional, YYYY-MM-DD. Leave empty for a single-day event.
    validations:
      required: false
  - type: input
    id: end-time
    attributes:
      label: End time
      description: Optional, e.g. 21:00 or 9pm
    validations:
      required: false
  - type: input
    id: venue
    attributes:
      label: Venue
      description: The venue's name, or "Online" for an online event.
      placeholder: National Library Building
    validations:
      required: true
  - type: input
    id: venue-address
    attributes:
      label: Venue address
      description: Optional for online events.
      placeholder: 100 Victoria St, Singapore 188064
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Short description
      description: One or two sentences, shown on the event card and in search results.
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Full details
      description: Optional. The agenda, speakers and anything else attendees should know. Markdown works (HTML doesn't).
    validations:
      required: false
  - type: input
    id: rsvp-url
    attributes:
      label: Registration link
      description: Where people sign up, e.g. a Google Form, FormSG or ticketing page.
      placeholder: https://forms.gle/...
    validations:
      required: true
  - type: input
    id: rsvp-text
    attributes:
      label: Registration button text
      description: Optional. Defaults to "Register".
      placeholder: Register
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional. Up to 10, separated by commas.
      placeholder: rust, programming, meetup
    validations:
      required: false
  - type: textarea
    id: image
    attributes:
      label: Event image
      description: Optional. Drag and drop the event's banner image (JPEG, PNG or WebP, ideally landscape) into this box.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes for the team
      description: Optional. Anything else we should know.
    validations:
      required: false
